# El sitio vive en rexsite-landing/, no en la raíz del repo.
# Sin este archivo Netlify publica la raíz y devuelve 404.
[build]
  publish = "rexsite-landing"

# Cabeceras de caché: el HTML siempre fresco, los assets con hash de un año.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# 23 nov 2026: la página vieja de Estados Unidos (/start, la de la prueba de
# $49) manda a la oferta nueva (/start/plan). Temporal (302) para poder
# quitarlo borrando estos bloques; Netlify pasa el ?fbclid/utm del anuncio.
# Solo /start exacto: signup, thanks, call, plan, etc. no cambian.
[[redirects]]
  from = "/start"
  to = "/start/plan"
  status = 302
  force = true

[[redirects]]
  from = "/start/"
  to = "/start/plan"
  status = 302
  force = true

[[redirects]]
  from = "/start/index.html"
  to = "/start/plan"
  status = 302
  force = true
