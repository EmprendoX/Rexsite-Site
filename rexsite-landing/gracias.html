<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Gracias de la landing de México: paso 2 de 2.
     Lo principal de esta página es activar la prueba en Stripe (en pesos).
     El "ya quedó, revisa tu correo" va en bienvenida.html, a donde Stripe
     manda a la persona después de activar la prueba. -->
<title>Último paso — RexSite</title>
<meta name="theme-color" content="#0A1D36">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '956132630850037');
fbq('track', 'PageView');
// Llegar hasta aquí sólo es posible si el registro se guardó (en el
// dashboard o en la copia de respaldo), así que lo contamos como Lead.
// Una sola vez por dirección: quien regresa de Stripe con "Atrás" o
// recarga la página no cuenta como otro registro. El número "lead_<dirección>"
// es el mismo que usa la landing de Estados Unidos: si algún día el dashboard
// le manda a Meta este Lead desde el servidor, Meta junta los dos.
(function () {
  var clave = '';
  var opciones = null;
  try {
    var dir = (new URLSearchParams(window.location.search).get('dir') || '').toLowerCase();
    if (dir) clave = 'rexsite_mx_lead_' + dir.slice(0, 80);
    var sub = /^([a-z0-9][a-z0-9-]{1,61}[a-z0-9])\.rexsite\.ai$/.exec(dir);
    if (sub) opciones = { eventID: 'lead_' + sub[1] };
    if (clave && window.sessionStorage.getItem(clave)) return;
  } catch (e) { /* sin almacenamiento: se cuenta */ }
  if (opciones) fbq('track', 'Lead', {}, opciones);
  else fbq('track', 'Lead');
  try { if (clave) window.sessionStorage.setItem(clave, '1'); } catch (e) { /* nada */ }
})();
// InitiateCheckout se dispara al hacer clic en el botón de pago (ver el
// script al final), no al cargar.
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=956132630850037&ev=Lead&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->

<style>
.puente{
  min-height:100dvh; display:grid; place-items:center;
  text-align:center; padding:32px;
  background:
    radial-gradient(80% 60% at 50% 0%, var(--sky), transparent 70%),
    var(--ivory-2);
}
.puente > div{ max-width:520px; }
.puente__logo{ width:150px; margin:0 auto 28px; }
.puente .eyebrow{ margin-bottom:14px; }
.puente .eyebrow::before{ display:none; } /* sin la rayita: así queda centrado */
.puente h1{ font-size:clamp(1.6rem,3.4vw,2.2rem); margin-bottom:18px; }
.puente p{ color:var(--tx-2); margin-bottom:24px; }

/* La dirección que tendrá su sitio. */
.puente__dir{
  display:inline-block; margin:6px 0 0;
  padding:8px 14px; border-radius:var(--r-sm);
  background:var(--sky); color:var(--blue-deep);
  font-weight:700; overflow-wrap:anywhere;
}

/* El botón de activar es lo principal de la página. */
.puente__pago .btn{ width:100%; }
.puente__condiciones{ font-size:.92rem; color:var(--tx-2); margin-top:16px; }
.puente .puente__condiciones{ margin-bottom:0; }
.puente .puente__diseno{ font-size:.88rem; color:var(--tx-3); margin-top:28px; margin-bottom:0; }
</style>
</head>
<body>

<main class="puente">
  <div>
    <img class="puente__logo" src="assets/img/logo.png?v=2" alt="RexSite" width="730" height="220">

    <span class="eyebrow">Paso 2 de 2</span>
    <h1>Último paso: activa tu prueba gratis.</h1>

    <!-- ?dir=nombre.rexsite.ai muestra la dirección que quedó apartada. Sin
         dirección (p. ej. cuando el sistema no respondió y los datos quedaron
         en la copia de respaldo) se dice solo que recibimos los datos. -->
    <p id="msg-dir" hidden>
      Tu dirección quedó apartada:<br>
      <span class="puente__dir" id="dir"></span>
    </p>
    <p id="msg-recibido">Recibimos tus datos.</p>

    <!-- PAGO: link de pago de Stripe en pesos (14 días gratis, después $499
         MXN al mes; Stripe cobra $0 hoy). Al terminar, Stripe manda a
         /bienvenida.html. Con ?dir= el script le agrega
         ?client_reference_id=<dirección> (ver abajo). -->
    <div class="puente__pago">
      <a class="btn btn--lg" id="ir-a-activar" href="https://buy.stripe.com/5kQ8wI7nw3Kl5yD2L16sw04" rel="noopener">
        <span>ACTIVAR MIS 14 DÍAS GRATIS</span> <span class="arw" aria-hidden="true">→</span>
      </a>
      <p class="puente__condiciones">Hoy no se te cobra nada. 14 días gratis y después $499 MXN al mes. Cancela cuando quieras.</p>
    </div>

    <!-- ?diseno=signature|clasica: el diseño que eligió en el formulario. -->
    <p class="puente__diseno" id="msg-diseno" hidden>Diseño elegido: <strong id="diseno"></strong></p>
  </div>
</main>

<script>
(function () {
  'use strict';
  // Qué mostrar. La dirección solo se muestra si tiene la forma
  // nombre.rexsite.ai, y como texto (nunca como HTML).
  try {
    var params = new URLSearchParams(window.location.search);
    var dir = (params.get('dir') || '').toLowerCase();
    if (params.get('respaldo') !== '1' && /^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?\.rexsite\.ai$/.test(dir)) {
      // En pantallas angostas, que corte antes de ".rexsite.ai".
      var el = document.getElementById('dir');
      var corte = dir.lastIndexOf('.rexsite.ai');
      el.appendChild(document.createTextNode(dir.slice(0, corte)));
      el.appendChild(document.createElement('wbr'));
      el.appendChild(document.createTextNode(dir.slice(corte)));
      document.getElementById('msg-recibido').hidden = true;
      document.getElementById('msg-dir').hidden = false;
      // El botón de Stripe lleva la dirección apartada (sin ".rexsite.ai"):
      // al activar la prueba, Stripe se la pasa al dashboard y su sitio se
      // reconoce aunque escriba otro correo. Stripe solo acepta letras,
      // números y guiones, que es justo lo que permite la regla de arriba.
      var activar = document.getElementById('ir-a-activar');
      activar.href = activar.href.split('?')[0] + '?client_reference_id=' + encodeURIComponent(dir.slice(0, corte));
      // Para mostrarla en bienvenida.html cuando vuelva de Stripe.
      try {
        window.localStorage.setItem('rexsite_mx_dir', JSON.stringify({ dir: dir, t: Date.now() }));
      } catch (e) { /* sin almacenamiento: bienvenida.html no muestra la dirección */ }
    } else {
      // Sin dirección: que bienvenida.html no muestre la de un registro anterior.
      try { window.localStorage.removeItem('rexsite_mx_dir'); } catch (e) { /* nada */ }
    }
    // Solo los dos nombres conocidos; cualquier otra cosa no se muestra.
    var NOMBRES_DISENO = { signature: 'Signature', clasica: 'Clásica' };
    var diseno = params.get('diseno');
    if (Object.prototype.hasOwnProperty.call(NOMBRES_DISENO, diseno)) {
      document.getElementById('diseno').textContent = NOMBRES_DISENO[diseno];
      document.getElementById('msg-diseno').hidden = false;
    }
  } catch (e) { /* navegador muy viejo: queda "Recibimos tus datos." */ }
})();

(function () {
  'use strict';
  // Meta Pixel: el clic es lo que lleva al pago en Stripe.
  // Si un bloqueador impide cargar el pixel, fbq no existe y no hacemos nada:
  // el enlace de pago nunca se ve afectado.
  document.getElementById('ir-a-activar').addEventListener('click', function () {
    if (typeof window.fbq !== 'function') return;
    window.fbq('track', 'InitiateCheckout', {
      content_name: 'Prueba 14 días',
      content_category: 'Suscripción RexSite'
    });
  });
})();
</script>

</body>
</html>
